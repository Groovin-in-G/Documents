<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow"><title>Protected</title>
<style>
  :root{--bg:#08090d;--ink:#e8ecf3;--muted:#8b93a7;--line:rgba(255,255,255,.12);--accent:#4ea3ff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;
    background-image:radial-gradient(900px 500px at 70% 0%,rgba(78,163,255,.12),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(169,129,255,.10),transparent 55%)}
  .card{width:min(92vw,380px);text-align:center;padding:8px}
  .lock{font-size:34px;margin-bottom:18px;opacity:.9}
  h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
  p{color:var(--muted);font-size:14px;margin-top:8px}
  form{margin-top:26px;display:flex;flex-direction:column;gap:10px}
  /* 16px IS LOAD-BEARING, DO NOT MAKE IT SMALLER. iOS Safari zooms the whole page in when it
     focuses a text input with a font-size under 16px, and this input is autofocused, so the
     zoom fires on load. The zoom then SURVIVES document.write (zoom is viewport state, not
     document state), so the decrypted page opened zoomed in and part-scrolled. One 15px
     declaration on the lock screen was silently deciding how the shared page rendered. */
  input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);font-size:16px;outline:none;transition:.15s}
  input:focus{border-color:var(--accent);background:rgba(78,163,255,.06)}
  button{width:100%;background:var(--accent);color:#021018;border:0;border-radius:10px;padding:13px 18px;font-weight:600;font-size:15px;cursor:pointer}
  button:active{transform:translateY(1px)}
  .err{color:#ff6b6b;font-size:13px;margin-top:14px;min-height:18px;opacity:0;transition:.2s}
  .err.show{opacity:1}
</style></head>

const dec=b64=>Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const err=document.getElementById('err');err.classList.remove('show');
  const pw=document.getElementById('pw').value;
  try{
    const enc=new TextEncoder();
    const bk=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:dec(PKG.salt),iterations:PKG.iter,hash:'SHA-256'},bk,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(PKG.iv)},k,dec(PKG.ct));
    const s=new TextDecoder().decode(pt);
    // OPEN THE PAGE AT THE TOP. The password input is autofocused, so mobile Safari
    // scrolls the document up to clear the on-screen keyboard, and document.write does
    // NOT reset the window's scroll offset. Without this the decrypted page opens ~150px
    // down with its masthead cut in half, which reads as a broken page rather than a
    // scrolled one. blur first (drops the keyboard), pin scrollRestoration so a reload
    // cannot put it back, then force the top three times: once now, once after the new
    // document lays out, once after Safari's own restore would have fired.
    // behavior:'instant' matters: a decrypted page may set html{scroll-behavior:smooth},
    // which would otherwise animate these and lose the race.
    document.getElementById('pw').blur();
    if('scrollRestoration' in history){history.scrollRestoration='manual';}
    document.open();document.write(s);document.close();
    const top=()=>window.scrollTo({top:0,left:0,behavior:'instant'});
    top();requestAnimationFrame(top);setTimeout(top,60);
  }catch(ex){err.classList.add('show');}
});
